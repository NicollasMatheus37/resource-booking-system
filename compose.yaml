name: resource-booking

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ espera o mount em /var/lib/postgresql (os dados ficam num
      # subdiretório por versão, o que permite pg_upgrade --link sem atrito).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # A API só sobe depois que o banco aceita conexões — sem isso, o boot
      # falha por corrida de inicialização e não por erro real.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}']
      interval: 3s
      timeout: 3s
      retries: 20

  # Passo de release: aplica as migrations e sai. A API só sobe depois que
  # este serviço termina com sucesso (12-Factor V, ADR 0010).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@postgres:5432/${POSTGRES_DB:-booking}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Processo administrativo one-off: popula recursos, slots e usuários.
  # Rodar com: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@postgres:5432/${POSTGRES_DB:-booking}
      SLOT_DURATION_MINUTES: ${SLOT_DURATION_MINUTES:-30}
      SCHEDULE_HORIZON_DAYS: ${SCHEDULE_HORIZON_DAYS:-7}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['tools']
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Explícito de propósito: sem isto, o Docker constrói o ÚLTIMO estágio
      # do arquivo, que é o processo administrativo de seed.
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@postgres:5432/${POSTGRES_DB:-booking}
      PORT: '3000'
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      SLOT_DURATION_MINUTES: ${SLOT_DURATION_MINUTES:-30}
      SCHEDULE_HORIZON_DAYS: ${SCHEDULE_HORIZON_DAYS:-7}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      # Lido pelo browser do usuário, por isso localhost e não o nome do serviço.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  postgres-data:
