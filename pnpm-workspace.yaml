# Monorepo integrado do Nx: libs resolvidas por tsconfig paths, não por
# workspaces do package manager (ver ADR 0001). Este arquivo existe apenas
# para liberar scripts de build, que o pnpm 11 bloqueia por padrão.
allowBuilds:
  '@swc/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true
  '@nestjs/core': false
minimumReleaseAgeExclude:
  - daisyui@5.7.28
