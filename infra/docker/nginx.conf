server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Config de runtime nunca pode ser cacheada: uma env.js velha aponta para
  # a API errada (ADR 0010).
  location = /env.js {
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
